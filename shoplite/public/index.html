<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopLite - Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>🛍️ ShopLite (Brownfield App)</h1>
        <a href="login.html" class="btn btn-outline-primary">Login / Logout</a>
    </header>

    <div class="row">
        <!-- Product Catalog Section -->
        <div class="col-md-8">
            <h3>Product Catalog</h3>
            <div id="product-list" class="row g-3 mt-2">
                <!-- Products will be loaded dynamically via script.js -->
            </div>
        </div>

        <!-- Shopping Cart Section -->
        <div class="col-md-4">
            <h3>Shopping Cart</h3>
            <ul id="cart-items" class="list-group mb-3">
                <li class="list-group-item text-muted">Cart is empty</li>
            </ul>
            <button class="btn btn-success w-100" onclick="alert('Checkout feature coming soon!')">Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
